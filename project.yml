name: PantherFFSkinViewer
options:
  bundleIdPrefix: com.panther
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    SWIFT_VERSION: '5.0'
targets:
  PantherFFSkinViewer:
    type: application
    platform: iOS
    sources: [PantherFFSkinViewer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panther.ffskinviewer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Panther FF Viewer
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED: NO
